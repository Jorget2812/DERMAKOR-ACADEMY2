name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check for secrets in example files
        run: |
          # Fail if .env.local.example contains what looks like a real JWT or key
          if grep -qE 'eyJ[A-Za-z0-9_-]{20,}' .env.local.example 2>/dev/null; then
            echo "ERROR: .env.local.example appears to contain a real JWT token!"
            exit 1
          fi
          echo "No credentials detected in .env.local.example"

